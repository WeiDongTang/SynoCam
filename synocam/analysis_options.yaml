include: package:flutter_lints/flutter.yaml

# 只做保守配置：不额外开启会产生大量 info 的自定义规则，
# 避免 `flutter analyze`（默认对任何 issue 返回非零）在 CI 里被无关告警拖挂。
analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    # tool/ 是纯 Dart CLI 自检脚本，刻意用相对导入 + print，
    # 不纳入 App 的 lint 门禁（脚本自身另有 // ignore_for_file 兜底）。
    - tool/**
